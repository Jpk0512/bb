name: Fork upstream rebase

# NSAI fork only. Rebases this branch onto upstream and re-checks the surfaces
# the fork owns, so drift surfaces early. It never touches the packaged
# /Applications/bb.app or its official update feed.
#
# This used to replay a patches/ directory. The fork now edits core directly, so
# the branch itself is the source of truth and a real rebase is the honest test:
# a conflict, or a fork surface that silently stops working, fails here instead
# of on the next upstream release.
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream ref (tag, branch, or upstream/main)"
        required: false
        default: "upstream/main"
  push:
    branches:
      # Only the living fork branch. Feature/worktree pushes under nsai/
      # must not each fire a rebase (that is what flooded notifications).
      - nsai/phase-5-fork

concurrency:
  group: fork-rebase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebase-onto-upstream:
    name: Rebase onto upstream and verify fork surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fork branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/get-bb/bb.git || true
          # desktop-latest / desktop-nightly are moving tags on upstream.
          # A plain --tags fetch fails with "would clobber existing tag" and
          # never reaches the rebase. Force-update tags in this ephemeral CI
          # clone only; do not push them back to origin.
          git fetch upstream --prune
          git fetch upstream --tags --force --prune

      - name: Rebase onto upstream
        env:
          TARGET: ${{ github.event.inputs.ref || 'upstream/main' }}
        run: |
          set -euo pipefail
          git config user.email "bb-fork-ci@users.noreply.github.com"
          git config user.name "bb-fork-ci"
          # Fails loudly on conflict. That is the signal: resolve it here rather
          # than discovering it while trying to ship.
          git rebase "$TARGET"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # Each step below guards one thing the fork added. If an upstream refactor
      # silently drops one, this is where it shows up.
      - name: Updater kill-switch stays honored
        run: pnpm exec vitest run --config vitest.config.ts test/desktop-auto-update.test.ts
        working-directory: apps/desktop

      - name: Dev app port override stays honored
        run: pnpm exec vitest run packages/scripts/test/run-dev.test.ts --root .

      - name: Proxied browser origins stay allowed
        run: |
          pnpm exec vitest run packages/config/test/local-app-origins.test.ts --root .
          pnpm exec vitest run plugins/connect/src/local-loopback.test.ts --root .

      - name: Server origin guard stays correct
        run: pnpm exec vitest run test/browser-request-guard.test.ts
        working-directory: apps/server

      - name: transcriptPrelude slot stays wired and documented
        run: |
          pnpm exec vitest run test/services/plugins/plugin-authoring-docs.test.ts
        working-directory: apps/server

      - name: bb.local stays an allowed dev host
        run: |
          set -euo pipefail
          # No test owns this one-line allowlist, so assert it directly rather
          # than let a config rewrite drop it unnoticed.
          grep -q '"bb.local"' apps/app/vite.dev.config.ts
