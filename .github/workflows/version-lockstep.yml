name: Version Lockstep

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check bb-app and desktop versions
    # Blacksmith runners only exist on upstream get-bb/bb. On a fork the job
    # queues for a runner that never arrives and GitHub kills it at the 24h
    # queue limit — timeout-minutes does not help, it caps execution, not queue
    # time. Fall back to GitHub-hosted runners anywhere but upstream.
    runs-on: ${{ github.repository == 'get-bb/bb' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x

      - name: Check version lockstep
        run: node .github/workflows/check-version-lockstep.mjs
